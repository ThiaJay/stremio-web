plugins { id 'com.android.application' }
android {
  namespace 'org.thiajay.stremioenhanced.mediaqa'
  compileSdk 36
  defaultConfig {
    applicationId 'org.thiajay.stremioenhanced.mediaqa'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '0.0.1-ci-only'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  lint { abortOnError true }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }

name: Night Audio player UI validation
on:
  push:
    branches:
      - feature/night-audio-menu-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies without running package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Night Audio and existing player regressions
        run: pnpm exec jest --runInBand
      - name: Lint
        run: pnpm exec eslint src --max-warnings 287
      - name: Compile isolated Web candidate
        run: pnpm exec webpack --mode production
      - name: Production advisory check
        run: pnpm audit --prod --audit-level moderate

name: Android DTS recovery fast compile

on:
  push:
    branches: [android/dts-audio-recovery]
    paths:
      - android-dts/src/**
      - android-dts/test/**
      - .github/workflows/android-dts-fast.yml
  workflow_dispatch:

concurrency:
  group: android-dts-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: anilbeesetti/nextlib
          ref: 6ff6cf9d0820382b3c233d018c52e4163b09d345
          path: nextlib
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: anilbeesetti/nextlib
          ref: 2dc77cd2d9352bc308aa26782f9c77a320df510b
          path: nextlib-new
          persist-credentials: false
      - name: Apply compile only backport
        shell: bash
        run: |
          set -euo pipefail
          base=media3ext/src/main/java/io/github/anilbeesetti/nextlib/media3ext/ffdecoder
          for file in DecoderMode.kt DecoderRendererController.kt DecoderManager.kt NextRenderersFactory.kt; do
            cp "nextlib-new/$base/$file" "nextlib/$base/$file"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('nextlib/media3ext/src/main/java/io/github/anilbeesetti/nextlib/media3ext/ffdecoder/FfmpegLibrary.java')
          s=p.read_text()
          old='case MimeTypes.AUDIO_DTS, MimeTypes.AUDIO_DTS_HD -> "dca";'
          new='case MimeTypes.AUDIO_DTS, MimeTypes.AUDIO_DTS_HD, MimeTypes.AUDIO_DTS_EXPRESS, MimeTypes.AUDIO_DTS_X -> "dca";'
          if s.count(old) != 1:
              raise SystemExit('Unexpected DTS mapping baseline')
          p.write_text(s.replace(old,new))
          b=Path('nextlib/media3ext/build.gradle.kts')
          bs=b.read_text()
          anchor='    compileOnly(libs.kotlin.annotations.jvm)\n}'
          replacement='    compileOnly(libs.kotlin.annotations.jvm)\n    testImplementation("junit:junit:4.13.2")\n}'
          if bs.count(anchor) != 1:
              raise SystemExit('Unexpected test dependency baseline')
          b.write_text(bs.replace(anchor,replacement))
          PY
          dst=nextlib/media3ext/src/test/java/com/stremio/common/players
          mkdir -p "$dst"
          cp android-dts/src/DtsAudioRecoveryPolicy.kt "$dst/"
          cp android-dts/src/DtsAudioRecoveryController.kt "$dst/"
          cp android-dts/test/DtsAudioRecoveryPolicyTest.kt "$dst/"
      - name: Compile candidate without native FFmpeg rebuild
        working-directory: nextlib
        run: |
          ./gradlew :media3ext:compileDebugKotlin :media3ext:compileDebugUnitTestKotlin -x ffmpegSetup --stacktrace

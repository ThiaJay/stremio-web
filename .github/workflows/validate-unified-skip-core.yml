name: Unified Skip Core Integration

on:
  push:
    branches:
      - feat/unified-skip-segments
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-skip-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-core-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web
        uses: actions/checkout@v7
        with:
          path: web

      - name: Checkout exact Core branch
        uses: actions/checkout@v7
        with:
          repository: ThiaJay/stremio-core
          ref: feat/skip-segments-core-successor
          path: core

      - name: Rust setup
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2.87.11
        with:
          tool: wasm-pack@0.14.0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build exact Core Web package
        working-directory: core/stremio-core-web
        run: |
          npm ci
          npm run build-dev
          npm pack

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Overlay exact Core package
        working-directory: web
        run: |
          CORE_TGZ="$(find ../core/stremio-core-web -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$CORE_TGZ"
          pnpm add --ignore-workspace-root-check "$CORE_TGZ"

      - name: Build Web with exact Core
        working-directory: web
        run: pnpm build

      - name: Test Web with exact Core
        working-directory: web
        run: pnpm test -- --runInBand

      - name: Lint Web
        working-directory: web
        run: pnpm lint

name: Reconcile universal player integration

on:
  push:
    branches: [reconcile/universal-player-web-20260922]
    paths:
      - '.github/workflows/reconcile-universal-player-web.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Merge accepted development and resolve known overlaps deliberately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin development integration/universal-player-web
          test "$(git rev-parse origin/integration/universal-player-web)" = "6990b8fcf517ae3bcda98b119e516b0c8fb56870"
          test "$(git rev-parse origin/development)" = "3d622ff6cd9d9b28906404fc159a679511152a89"
          cp src/routes/Player/Player.js /tmp/integration-player.js
          set +e
          git merge --no-commit --no-ff origin/development
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected the recorded overlap set, merge unexpectedly became clean.' >&2
            exit 1
          fi
          mapfile -t actual < <(git diff --name-only --diff-filter=U | sort)
          expected=(
            '.github/workflows/validate-unified-skip-core.yml'
            'package.json'
            'pnpm-lock.yaml'
            'src/core/types/models/Player.d.ts'
            'src/routes/Player/Player.js'
            'src/routes/Player/SkipIntroPopup/SkipIntroPopup.js'
            'src/routes/Player/SkipIntroPopup/styles.less'
            'src/routes/Player/getSkipSegmentPopupOpen.js'
            'src/routes/Player/getSkipSegmentTarget.js'
            'src/routes/Player/shouldAutoSkipSegment.js'
            'tests/skipSegments.spec.js'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
            printf 'Unexpected conflict set:\n%s\n' "$(printf '%s\n' "${actual[@]}")" >&2
            exit 1
          fi

          git checkout --theirs -- \
            .github/workflows/validate-unified-skip-core.yml \
            src/routes/Player/SkipIntroPopup/SkipIntroPopup.js \
            src/routes/Player/SkipIntroPopup/styles.less \
            src/routes/Player/getSkipSegmentPopupOpen.js \
            src/routes/Player/getSkipSegmentTarget.js \
            src/routes/Player/shouldAutoSkipSegment.js \
            tests/skipSegments.spec.js
          git checkout --ours -- src/core/types/models/Player.d.ts pnpm-lock.yaml
          git checkout --theirs -- src/routes/Player/Player.js package.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const playerPath = 'src/routes/Player/Player.js';
          let player = fs.readFileSync(playerPath, 'utf8');
          const integration = fs.readFileSync('/tmp/integration-player.js', 'utf8');

          const oldHook = "    const [player, videoParamsChanged, streamStateChanged, audioPreferenceChanged, subtitlePreferenceChanged, videoScaleChanged, timeChanged, seek, pausedChanged, ended, nextVideo] = usePlayer(urlParams);";
          const newHook = "    const [player, videoParamsChanged, streamStateChanged, audioPreferenceChanged, subtitlePreferenceChanged, videoScaleChanged, timeChanged, seek, pausedChanged, ended, nextVideo, avSyncObserved, playbackHealthObserved] = usePlayer(urlParams);";
          if (!player.includes(oldHook)) throw new Error('Expected accepted development usePlayer hook was not found');
          player = player.replace(oldHook, newHook);

          const start = integration.indexOf('    const appliedAvSyncCorrection = React.useRef');
          const end = integration.indexOf('    const [casting, setCasting]', start);
          if (start < 0 || end < 0 || end <= start) throw new Error('Could not isolate validated integration A/V and recovery block');
          const integrationBlock = integration.slice(start, end);
          const anchor = '    const [seeking, setSeeking] = React.useState(false);\n\n';
          if (!player.includes(anchor)) throw new Error('Accepted development insertion anchor was not found');
          player = player.replace(anchor, anchor + integrationBlock);
          fs.writeFileSync(playerPath, player);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.dependencies['@stremio/stremio-core-web'] = 'https://raw.githubusercontent.com/ThiaJay/stremio-core/85f9b5de97105e254fe85ef9da9cfecafd66e190/stremio-core-web/development/stremio-stremio-core-web-0.63.1.tgz';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 4) + '\n');
          NODE

          git add .
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge paths remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
      - name: Regenerate exact package lock
        shell: bash
        run: pnpm install --lockfile-only
      - name: Verify frozen installation
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Validate native video adapter
        shell: bash
        run: node --test tests/videoBackendLifecycle.native.cjs
      - name: Run Web tests
        shell: bash
        run: pnpm test --runInBand
      - name: Build production Web
        shell: bash
        run: pnpm build
      - name: Lint Web
        shell: bash
        run: pnpm lint
      - name: Commit exact reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          rm .github/workflows/reconcile-universal-player-web.yml
          git add -A
          git commit -m 'Reconcile universal player integration with accepted development'
          git push origin HEAD:reconcile/universal-player-web-20260922

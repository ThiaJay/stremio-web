name: Temporary Core package lock refresh

on:
  push:
    branches:
      - fix/core-web-bind-e12-20260923
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: "github.event.head_commit.message != 'chore: refresh Core package lock'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/core-web-bind-e12-20260923
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Refresh exact lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile change required"
            exit 0
          fi
          git config user.name ThiaJay
          git config user.email "3618451+ThiaJay@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Core package lock"
          git push origin HEAD:fix/core-web-bind-e12-20260923

name: A V recovery round trip
on:
  push:
    branches: [feat/av-sync-session-safety]
    paths:
      - tests/av-sync-contract/**
      - .github/workflows/av-sync-contract.yml
      - av-sync-v2-inputs.json
      - src/routes/Player/avSyncV2Bridge.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the exact validated Core source
        id: inputs
        run: |
          python3 - <<'PY'
          import json, os, re
          inputs = json.load(open('av-sync-v2-inputs.json'))
          ref = inputs['coreSourceCommit']
          assert re.fullmatch(r'[a-f0-9]{40}', ref), 'An immutable Core commit is required'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('core_ref=' + ref + '\n')
          PY
      - uses: actions/checkout@v7
        with:
          repository: ThiaJay/stremio-core
          ref: ${{ steps.inputs.outputs.core_ref }}
          path: .contract-core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .contract-core -> target
      - name: Compile the real Core policy and action schema
        run: |
          test "$(git -C .contract-core rev-parse HEAD)" = "$(python3 -c 'import json; print(json.load(open("av-sync-v2-inputs.json"))["coreSourceCommit"])')"
          mkdir -p .contract-core/examples
          cp tests/av-sync-contract/av_sync_contract.rs .contract-core/examples/av_sync_contract.rs
          cargo build --manifest-path .contract-core/Cargo.toml --locked --example av_sync_contract
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and verify the exact candidate dependencies
        run: |
          node scripts/integrate-av-sync-v2.cjs
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Test native observation through Core and back to native recovery
        run: node tests/av-sync-contract/roundtrip.cjs

name: Build installable Stremio DTS fallback APK

on:
  push:
    branches: [android/tv-side-by-side-dts]
    paths: [.github/workflows/build-stremio-dts-fallback-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: stremio-native/stremio-android
          ref: 4bdef3b6be1186d9aa22acd8b3ec391c22f0e083
          path: android-app
          submodules: recursive
          persist-credentials: false
      - name: Force MPV primary with Exo fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/src/main/java/com/stremio/mobile/player/Player.kt')
          s=p.read_text()
          old='''        fun fromProfileValue(value: String?): PlayerEngine {
            return entries.firstOrNull { it.profileValue.equals(value, ignoreCase = true) } ?: EXO
        }'''
          new='''        fun fromProfileValue(value: String?): PlayerEngine {
            return MPV
        }'''
          if s.count(old) != 1:
              raise SystemExit('PlayerEngine baseline changed')
          p.write_text(s.replace(old,new))
          test=Path('android-app/app/src/test/java/com/stremio/mobile/player/PlayerEngineTest.kt')
          if test.exists():
              ts=test.read_text()
              test.write_text(ts.replace(
                  'assertEquals(PlayerEngine.EXO, PlayerEngine.fromProfileValue(null))',
                  'assertEquals(PlayerEngine.MPV, PlayerEngine.fromProfileValue(null))'
              ).replace(
                  'assertEquals(PlayerEngine.EXO, PlayerEngine.fromProfileValue("exo"))',
                  'assertEquals(PlayerEngine.MPV, PlayerEngine.fromProfileValue("exo"))'
              ).replace(
                  'assertEquals(PlayerEngine.EXO, PlayerEngine.fromProfileValue("vlc"))',
                  'assertEquals(PlayerEngine.MPV, PlayerEngine.fromProfileValue("vlc"))'
              ))
          PY
          git -C android-app diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test installable debug APK
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest :mpv-android-lib:assembleDebug :app:assembleDebug --stacktrace
      - name: Collect universal APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find android-app/app/build/outputs/apk/debug -type f -name '*.apk' -print
          universal="$(find android-app/app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' -print -quit)"
          if [[ -z "$universal" ]]; then
            universal="$(find android-app/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          fi
          test -n "$universal"
          cp "$universal" dist/Stremio-DTS-Fallback-universal-debug.apk
          sha256sum dist/Stremio-DTS-Fallback-universal-debug.apk > dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          Side-by-side Stremio Android fallback build.
          Source: stremio-native/stremio-android commit 4bdef3b6be1186d9aa22acd8b3ec391c22f0e083.
          MPV is forced as the primary internal player. The app's existing PlaybackManager retains ExoPlayer fallback if MPV cannot initialize.
          Package: com.stremio.mobile, which is separate from official Android TV Stremio com.stremio.one.
          This is a debug-signed test build, not an official Stremio release.
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: stremio-dts-fallback-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

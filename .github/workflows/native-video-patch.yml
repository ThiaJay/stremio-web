name: Prepare native video dependency patch
on:
  push:
    branches: [fix/native-video-backend-patch]
    paths: [.github/workflows/native-video-patch.yml]
permissions:
  contents: read
concurrency:
  group: native-video-patch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'ThiaJay/stremio-web' && github.ref == 'refs/heads/fix/native-video-backend-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore reviewed Core integrity
        run: node scripts/restore-core-integrity.cjs
      - run: pnpm install --frozen-lockfile
      - name: Reproduce the reviewed dependency patch
        run: |
          pnpm patch @stremio/stremio-video@0.0.98 --edit-dir .video-patch
          node scripts/prepare-video-backend-patch.cjs .video-patch
          pnpm patch-commit .video-patch
          node - <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('patches').filter(p => p.endsWith('.patch'));
          if (files.length !== 1 || !files[0].includes('stremio-video')) throw new Error('Unexpected patch output');
          const from = 'patches/' + files[0];
          const to = 'patches/stremio_video_0_0_98.patch';
          fs.renameSync(from, to);
          for (const file of ['pnpm-workspace.yaml', 'pnpm-lock.yaml']) {
            const text = fs.readFileSync(file, 'utf8');
            if (file === 'pnpm-workspace.yaml' && text.split(from).length !== 2) throw new Error('Workspace patch reference missing or ambiguous');
            if (text.includes(from)) fs.writeFileSync(file, text.replaceAll(from, to));
          }
          NODE
          pnpm install --frozen-lockfile
      - name: Require exact bytes accepted by the private publication review
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          // Recorded by the successful private publication step in run 35693882850.
          const expected = {
            'package.json': 'c66357a051c6abb1e07f3c8f9b603114c3f0ee1e314d3e7bb24a9e43cd144646',
            'pnpm-lock.yaml': 'a085258bffdd8123145ab3c352bda5c18754ea578711b2a303a169b23b01856a',
            'pnpm-workspace.yaml': '855918800beb8afda59839b7ce94f4df2a888b9857571f9f3980a6a1d6122baa',
            'patches/stremio_video_0_0_98.patch': '633775119810c2c5c48d068e99889d4f764ed010b8a12dfb8611ee80e1da45a3'
          };
          for (const [file, hash] of Object.entries(expected)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== hash) throw new Error('Reviewed file differs ' + file);
          }
          // A patch has mandatory context prefixes on empty lines. Check added
          // source lines instead of mistaking those prefixes for source whitespace.
          const patch = fs.readFileSync('patches/stremio_video_0_0_98.patch', 'utf8');
          for (const line of patch.split('\n')) {
            if (line.startsWith('+') && !line.startsWith('+++') && /[\t ]$/.test(line)) throw new Error('Added source has trailing whitespace');
          }
          console.log('Exact reviewed dependency files and added source whitespace verified');
          NODE
      - run: node --test tests/videoBackendLifecycle.native.cjs
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm lint
      - name: Commit only verified dependency files to the isolated branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/native-video-backend-patch | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml patches/stremio_video_0_0_98.patch
          git diff --cached --check -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialise validated native video dependency patch'
          git push origin HEAD:refs/heads/fix/native-video-backend-patch

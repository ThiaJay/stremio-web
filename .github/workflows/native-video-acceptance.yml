name: Validate patched native video dependency
on:
  pull_request:
    branches: [integration/universal-player-web, development]
    paths:
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tests/videoBackendLifecycle.native.cjs
      - .github/workflows/native-video-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-video-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/videoBackendLifecycle.native.cjs
      - run: pnpm test --runInBand
      - if: runner.os == 'Linux'
        run: pnpm build
      - if: runner.os == 'Linux'
        run: pnpm lint

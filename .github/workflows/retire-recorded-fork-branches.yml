name: Retire recorded fork branches

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  retire:
    if: github.event.head_commit.message == 'Retire recorded fork branches'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete recorded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "automation/repair-skip-intro-evidence"
            "automation/stremio-delivery-review-20260921"
            "feat/skip-intro-button-ready"
            "repair/skip-intro-reference-image"
            "validate/skip-intro-popup-integrated"
            "validate/skip-intro-popup-web"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists after deletion: $branch"
              exit 1
            fi
          done

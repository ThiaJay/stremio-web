name: Regenerate current Core package lock

on:
  push:
    branches:
      - fix/core-package-rebind-148ab-20260924
    paths:
      - .github/workflows/rebind-core-package-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm --version
      - name: Regenerate lock only
        run: pnpm install --lockfile-only
      - name: Verify exact Core binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          package = Path('package.json').read_text()
          lock = Path('pnpm-lock.yaml').read_text()
          url = 'https://raw.githubusercontent.com/ThiaJay/stremio-core/38ab732eeb9948aa6665e298e0f668f46171a53e/stremio-core-web/development/stremio-stremio-core-web-0.63.1.tgz'
          integrity = 'sha512-rPpDV3anMGtR2iWI4Cyu+V1aPVyy4/Ykbu+LBO/ADxCf5SbOeVXlEUHyPpqt9rR8HYxfB15MSoWQRW1dWD/w1w=='
          assert url in package
          assert lock.count(url) >= 4
          assert integrity in lock
          PY
      - name: Commit regenerated lock and self remove
        shell: bash
        run: |
          rm .github/workflows/rebind-core-package-lock.yml
          git config user.name 'ThiaJay'
          git config user.email '3618451+ThiaJay@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/rebind-core-package-lock.yml
          git diff --cached --check
          git commit -m 'chore: regenerate lock for current Core package'
          git push origin HEAD:fix/core-package-rebind-148ab-20260924

name: Reconcile candidate Core package pin
on:
  push:
    branches: [fix/native-video-backend-patch]
    paths: [.github/workflows/reconcile-native-video-pin.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'ThiaJay/stremio-web' && github.ref == 'refs/heads/fix/native-video-backend-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve the exact newer integration work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 149d17350e76f7f9b504298876a2024894353072
      - name: Reconcile only the reviewed immutable package locator
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const oldPin = '194999e3e4048c37da86c7a4506316bc2542a266';
          const newPin = '9323c339c29006e315e6ae10cfe6effddb796fea';
          // Both deployment paths resolve to the independently reviewed Git blob
          // 89a98d0885b76979793dde7c6ba224962ec3acf5. The integrity is unchanged.
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (crypto.createHash('sha256').update(lock).digest('hex') !== 'a085258bffdd8123145ab3c352bda5c18754ea578711b2a303a169b23b01856a') throw new Error('Reviewed lock baseline changed');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const locator = pkg.dependencies['@stremio/stremio-core-web'];
          if (locator !== 'https://raw.githubusercontent.com/ThiaJay/stremio-core/' + newPin + '/stremio-core-web/integration/universal-player-core/dev/stremio-stremio-core-web-0.63.1.tgz') throw new Error('Unexpected Core locator');
          const changed = lock.replaceAll(oldPin, newPin);
          if (changed === lock || changed.replaceAll(newPin, oldPin) !== lock) throw new Error('Unexpected lock transformation');
          fs.writeFileSync('pnpm-lock.yaml', changed);
          NODE
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/videoBackendLifecycle.native.cjs
      - run: pnpm test --runInBand
      - run: pnpm build
      - run: pnpm lint
      - name: Save only to the unchanged candidate branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/native-video-backend-patch | cut -f1)" = "$EXPECTED_SHA"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'Preserve newer integration work and reconcile its identical Core package'
          git push origin HEAD:refs/heads/fix/native-video-backend-patch

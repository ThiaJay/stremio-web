name: A V Sync Integrity

on:
  push:
    branches:
      - feat/automatic-av-sync-core

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash Core prebuild
        run: |
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/ThiaJay/stremio-core/gh-pages/stremio-core-web/feat/automatic-av-sync-core/dev/stremio-stremio-core-web-0.63.1.tgz' \
            --output /tmp/core.tgz
          printf 'CORE_INTEGRITY=sha512-'
          openssl dgst -sha512 -binary /tmp/core.tgz | base64 -w0
          printf '\n'

name: Subtitle provenance and HTMLVideo integration source gates

on:
  pull_request:
    paths:
      - 'src/routes/Player/intelligentSubtitles/**'
      - 'src/routes/Player/useAudio.ts'
      - 'src/routes/Player/useSubtitles.ts'
      - 'src/routes/Settings/Player/EnhancedSubtitlePreferences.tsx'
      - 'tests/subtitlePreference*.node.mjs'
      - '.github/workflows/subtitle-htmlvideo-integration.yml'
  push:
    branches:
      - integration/subtitle-provenance-htmlvideo-20261101

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Verify original pinned Video source
        shell: bash
        run: |
          node - <<'JS'
          const p=require('./package.json');
          if (p.dependencies['@stremio/stremio-video'] !== 'github:ThiaJay/stremio-video#30af605c40229a84bed7b45f7c29908b32881f66') process.exit(2);
          if (p.dependencies['@stremio/stremio-core-web'] !== 'file:vendor/core-web/stremio-stremio-core-web-0.65.0.tgz') process.exit(3);
          console.log('SOURCE_PIN_PASS');
          JS
      - name: Install pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - name: Verify bundled Core provenance and frozen dependencies
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const provenance=require('./vendor/core-web/provenance.json');
          if (provenance.coreSourceSha !== '303d7c0bb8bd6d55f11f2f751e55e66040da4f8c') process.exit(4);
          const hash=crypto.createHash('sha256').update(fs.readFileSync('vendor/core-web/'+provenance.tarballName)).digest('hex');
          if(hash !== provenance.sha256 || hash !== '305cb2fb6c78ff6c719aa4713ddfd719787f38ef1069bb198592e6bda6d78c60') process.exit(5);
          console.log('CORE_BYTES_PASS');
          JS
      - name: Install frozen lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run all imported subtitle provenance tests
        run: |
          node --test tests/subtitlePreferencePlayerGate.node.mjs tests/subtitlePreferenceSettingsWrite.node.mjs tests/subtitlePreferenceStore.node.mjs tests/subtitlePreferenceStoreTypes.node.mjs tests/subtitleProvenanceTypes.node.mjs
      - name: Run existing subtitle and skip policies
        run: node --test tests/enhancedSubtitlesPolicy.node.mjs tests/enhancedSkipModes.node.mjs
      - name: Existing Web suite and lint
        run: |
          pnpm exec jest --runInBand
          pnpm exec eslint src --max-warnings 287
      - name: Build isolated Web preview
        run: pnpm exec webpack --mode production
      - name: Run anonymous browser smoke test
        run: node tests/enhancedBrowserSmoke.node.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
# Source-only checks. This workflow cannot install, upload or deploy.

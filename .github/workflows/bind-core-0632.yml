name: Bind Web to Core 0.63.2

on:
  push:
    branches:
      - chore/bind-core-0632-20260924

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify bootstrap parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c3120f11d2189515bef6e9422a697d5c534b3228"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/bind-core-0632.yml"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm --version

      - name: Bind immutable Core package
        shell: bash
        env:
          OLD_CORE_URL: https://raw.githubusercontent.com/ThiaJay/stremio-core/38ab732eeb9948aa6665e298e0f668f46171a53e/stremio-core-web/development/stremio-stremio-core-web-0.63.1.tgz
          NEW_CORE_URL: https://raw.githubusercontent.com/ThiaJay/stremio-core/a54ab1597a9824338535b250768f6257f5e95f01/stremio-core-web/development/stremio-stremio-core-web-0.63.2.tgz
          NEW_CORE_INTEGRITY: sha512-rXMZoD82OCmWPnmOjQHDi1K1Tg4KO2kejIX9P2HIIxeV0cx0RlmgYWZ5FlNptVfeHu3gVt3sXlyvH3G50oVjAg==
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const oldUrl = process.env.OLD_CORE_URL;
          const newUrl = process.env.NEW_CORE_URL;
          if (pkg.dependencies['@stremio/stremio-core-web'] !== oldUrl) {
            throw new Error('Core dependency no longer matches the expected accepted Web base');
          }
          pkg.dependencies['@stremio/stremio-core-web'] = newUrl;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + '\n');
          NODE

          pnpm install --lockfile-only

          test "$(git diff --name-only | sort | tr '\n' ' ')" = "package.json pnpm-lock.yaml "
          ! grep -Fq "$OLD_CORE_URL" package.json
          ! grep -Fq "$OLD_CORE_URL" pnpm-lock.yaml
          grep -Fq "$NEW_CORE_URL" package.json
          grep -Fq "$NEW_CORE_URL" pnpm-lock.yaml
          grep -Fq "$NEW_CORE_INTEGRITY" pnpm-lock.yaml
          grep -Fq "version: 0.63.2" pnpm-lock.yaml

      - name: Validate frozen install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Commit only the source binding
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bind-core-0632.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Bind Web to Core 0.63.2 package"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Stremio Enhanced isolated Android TV runtime acceptance

on:
  push:
    branches:
      - feature/enhanced-tv-webview-20261012-v1
    paths:
      - 'android-tv-shell/tests/emulator_smoke.sh'
      - 'android-tv-shell/app/src/main/java/org/thiajay/stremioenhanced/tv/EnhancedTvActivity.java'
      - 'android-tv-shell/app/build.gradle'
      - '.github/workflows/enhanced-tv-emulator-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-tv-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout exact, uncredentialed TV source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies with original frozen source lock
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile complete Enhanced Web without account or private config
        run: pnpm exec webpack --mode production
      - name: Bound and verify Web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s android-tv-shell/tests -p 'test_bundle_policy.py' -v
          python3 android-tv-shell/bundle_verified_web.py \
            --src build \
            --dst android-tv-shell/app/src/main/assets/web \
            --source-sha "$GITHUB_SHA"
          python3 android-tv-shell/tests/audit_android_source.py
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK 36 and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble exact independent TV application and test navigation policy
        run: gradle -p android-tv-shell :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Run real anonymous Android TV emulator boot and WebView smoke
        shell: bash
        run: bash android-tv-shell/tests/emulator_smoke.sh
# Dedicated experimental emulator run. No artifact upload, signing, release,
# account session, real user device, ADB network pairing or production write.

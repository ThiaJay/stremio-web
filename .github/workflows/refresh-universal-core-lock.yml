name: Refresh universal Core lockfile

on:
  push:
    branches:
      - integration/universal-player-web

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message == 'ci: refresh universal Core lockfile' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate lockfile from immutable combined Core package
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already exact"
            exit 0
          fi
          git commit -m "integration: regenerate exact combined Core lockfile"
          git push origin HEAD:integration/universal-player-web

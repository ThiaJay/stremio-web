name: Refresh verified Core pin

on:
  push:
    branches:
      - fix/skip-segment-runtime-safety
    paths:
      - .github/workflows/refresh-verified-core-pin.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/skip-segment-runtime-safety
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Refresh immutable Core dependency
        run: |
          pnpm install --frozen-lockfile
          pnpm add "@stremio/stremio-core-web@https://raw.githubusercontent.com/ThiaJay/stremio-core/dcb268f16b80eaea0affcb205a69780fb4de4a08/stremio-core-web/development/stremio-stremio-core-web-0.63.1.tgz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "Bind Web to current verified Core development package"
          git push origin HEAD:fix/skip-segment-runtime-safety

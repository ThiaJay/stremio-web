name: Native desktop shell acceptance

on:
  push:
    branches:
      - acceptance/native-desktop-shell-20260922
    paths:
      - .github/native-desktop-acceptance/**
      - .github/workflows/native-desktop-shell-acceptance.yml

permissions:
  contents: read

concurrency:
  group: native-desktop-shell-acceptance
  cancel-in-progress: true

jobs:
  linux-shell-runtime:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      PRODUCT_COMMIT: 26f2a5987618c62199593dec9a7ca18f0b2ac9f2
      LINUX_SHELL_COMMIT: fa63b2c5258759fcc1ac9bae9ce23d2e801ae441
      SERVER_PATH: /tmp/stremio-linux-shell/data/server.js
      LC_NUMERIC: C
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
    steps:
      - name: Bootstrap container
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y git ca-certificates curl

      - name: Checkout validation harness
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact product source binding
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git cat-file -e "${PRODUCT_COMMIT}^{commit}"
          unexpected="$(git diff --name-only "$PRODUCT_COMMIT" HEAD | grep -Ev '^\.github/native-desktop-acceptance/|^\.github/workflows/native-desktop-shell-acceptance\.yml$' || true)"
          test -z "$unexpected" || { printf 'Unexpected product drift:\n%s\n' "$unexpected"; exit 1; }
          printf 'web_product_commit %s\nvalidation_commit %s\nlinux_shell_commit %s\n' \
            "$PRODUCT_COMMIT" "$(git rev-parse HEAD)" "$LINUX_SHELL_COMMIT" > source-binding.txt

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev libmpv-dev gettext nodejs npm python3 ffmpeg \
            xvfb xauth dbus-x11 imagemagick mesa-utils libgl1-mesa-dri
          npm install --global pnpm@11.8.0
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build exact Web product in detached worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/web-product "$PRODUCT_COMMIT"
          cd /tmp/web-product
          pnpm install --frozen-lockfile
          pnpm build
          test -f "build/${PRODUCT_COMMIT}/scripts/main.js"

      - name: Build pinned current Stremio Linux shell
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Stremio/stremio-linux-shell.git /tmp/stremio-linux-shell
          cd /tmp/stremio-linux-shell
          git checkout --detach "$LINUX_SHELL_COMMIT"
          test "$(git rev-parse HEAD)" = "$LINUX_SHELL_COMMIT"
          test -f data/server.js
          "$HOME/.cargo/bin/cargo" build --release
          test -x target/release/stremio-linux-shell

      - name: Prepare deterministic native playback fixture
        shell: bash
        run: |
          set -euo pipefail
          cp .github/native-desktop-acceptance/native-desktop-fixture.html /tmp/web-product/build/native-desktop-fixture.html
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=30' \
            -f lavfi -i 'sine=frequency=1000:sample_rate=48000' \
            -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k \
            /tmp/web-product/build/native-desktop-fixture.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name -of json \
            /tmp/web-product/build/native-desktop-fixture.mp4 > fixture-media-info.json
          grep -q '"video"' fixture-media-info.json
          grep -q '"audio"' fixture-media-info.json

      - name: Exercise current native shell and real libmpv playback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-desktop-receipt
          export ACCEPTANCE_ROOT=/tmp/web-product/build
          export ACCEPTANCE_RECEIPT="$PWD/native-desktop-receipt/fixture-receipt.json"
          test -f "$SERVER_PATH"
          python3 .github/native-desktop-acceptance/server.py > native-desktop-receipt/web-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > native-desktop-receipt/web-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/native-desktop-fixture.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/native-desktop-fixture.html >/dev/null

          Xvfb :99 -screen 0 1280x720x24 > native-desktop-receipt/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "$XVFB_PID" > native-desktop-receipt/xvfb.pid
          export DISPLAY=:99
          eval "$(dbus-launch --sh-syntax)"
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          export RUST_LOG=debug

          /tmp/stremio-linux-shell/target/release/stremio-linux-shell \
            --url http://127.0.0.1:4173/native-desktop-fixture.html \
            > native-desktop-receipt/native-fixture-shell.log 2>&1 &
          FIXTURE_SHELL_PID=$!
          echo "$FIXTURE_SHELL_PID" > native-desktop-receipt/native-fixture-shell.pid

          for i in $(seq 1 45); do
            if [ -s native-desktop-receipt/fixture-receipt.json ]; then break; fi
            if ! kill -0 "$FIXTURE_SHELL_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          import -display :99 -window root native-desktop-receipt/native-mpv-FIXTURE.png || true
          test -s native-desktop-receipt/fixture-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('native-desktop-receipt/fixture-receipt.json').read_text())
          assert receipt.get('status') == 'pass', receipt
          assert float(receipt.get('timePos', 0)) >= 1.25, receipt
          assert 'native-desktop-fixture.mp4' in receipt.get('path', ''), receipt
          assert receipt.get('shellVersion'), receipt
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          kill "$FIXTURE_SHELL_PID" 2>/dev/null || true
          sleep 2

          /tmp/stremio-linux-shell/target/release/stremio-linux-shell \
            --url http://127.0.0.1:4173/#/board \
            > native-desktop-receipt/product-shell.log 2>&1 &
          PRODUCT_SHELL_PID=$!
          echo "$PRODUCT_SHELL_PID" > native-desktop-receipt/product-shell.pid
          sleep 15
          kill -0 "$PRODUCT_SHELL_PID"
          import -display :99 -window root native-desktop-receipt/native-product-FIXTURE.png || true
          grep -q "/${PRODUCT_COMMIT}/scripts/main.js" native-desktop-receipt/web-server.log
          grep -q "/${PRODUCT_COMMIT}/binaries/stremio_core_web_bg.wasm" native-desktop-receipt/web-server.log

          kill "$PRODUCT_SHELL_PID" 2>/dev/null || true
          kill "$SERVER_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          if [ -n "${DBUS_SESSION_BUS_PID:-}" ]; then kill "$DBUS_SESSION_BUS_PID" 2>/dev/null || true; fi

      - name: Preserve exact receipt
        if: always()
        shell: bash
        run: |
          mkdir -p native-desktop-receipt
          cp source-binding.txt native-desktop-receipt/source-binding.txt 2>/dev/null || true
          cp fixture-media-info.json native-desktop-receipt/fixture-media-info.json 2>/dev/null || true
          {
            cat source-binding.txt 2>/dev/null || true
            printf 'run %s\n' "$GITHUB_RUN_ID"
            printf 'fixture_sha256 '
            sha256sum /tmp/web-product/build/native-desktop-fixture.mp4 2>/dev/null | cut -d' ' -f1 || true
            printf 'fixture_harness_sha256 '
            sha256sum .github/native-desktop-acceptance/native-desktop-fixture.html | cut -d' ' -f1
            printf 'server_harness_sha256 '
            sha256sum .github/native-desktop-acceptance/server.py | cut -d' ' -f1
          } > native-desktop-receipt/SOURCE.txt
          for pidfile in native-desktop-receipt/*.pid; do
            [ -f "$pidfile" ] || continue
            kill "$(cat "$pidfile")" 2>/dev/null || true
          done

      - name: Upload native desktop receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-linux-shell-acceptance
          path: native-desktop-receipt/
          retention-days: 14
          if-no-files-found: error

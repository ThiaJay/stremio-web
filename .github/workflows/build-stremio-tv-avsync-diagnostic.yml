name: Build Fire TV AV sync diagnostic APK

on:
  push:
    branches:
      - android/tv-side-by-side-dts
    paths:
      - .github/workflows/build-stremio-tv-avsync-diagnostic.yml
      - android-dts/avsync-diagnostic/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -o /tmp/stremio.apk https://dl.strem.io/android/v1.10.4-androidTV/com.stremio.one-1.10.4-31048580-armeabi-v7a.apk
          echo 'e18a5405bb53e12a903ff477457318b8f8d3c8e1995e0a4c3ff5d8893d1ccf0b  /tmp/stremio.apk' | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -

      - name: Decode and patch
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f -o /tmp/decoded /tmp/stremio.apk
          python android-dts/avsync-diagnostic/patch_avsync_apk.py /tmp/decoded

      - name: Rebuild and sign
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore /tmp/avsync.jks -storepass changeit -keypass changeit -alias avsync -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Stremio AV Sync Diagnostic,O=Local Test,C=GB"
          "$build_tools/zipalign" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$build_tools/apksigner" sign --ks /tmp/avsync.jks --ks-pass pass:changeit --key-pass pass:changeit --out /tmp/Stremio-AV-Sync-Test-arm.apk /tmp/aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs /tmp/Stremio-AV-Sync-Test-arm.apk
          "$build_tools/aapt" dump badging /tmp/Stremio-AV-Sync-Test-arm.apk | grep -F "package: name='com.stremio.avsync'"

      - name: Package diagnostic kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/Stremio-AV-Sync-Test-arm.apk dist/
          cp android-dts/avsync-diagnostic/CAPTURE_SYNC.ps1 dist/
          cp android-dts/avsync-diagnostic/RUN_SYNC_TEST.cmd dist/
          cp android-dts/avsync-diagnostic/README.txt dist/
          sha256sum dist/Stremio-AV-Sync-Test-arm.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: stremio-avsync-diagnostic-arm
          path: dist/*
          if-no-files-found: error
          retention-days: 30

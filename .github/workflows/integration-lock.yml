name: Regenerate combined Core lockfile

on:
  push:
    branches:
      - integration/universal-player-web

permissions:
  contents: write

jobs:
  lock:
    if: github.event.head_commit.message != 'integration: regenerate combined Core lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/universal-player-web
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate exact lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name ThiaJay
          git config user.email "3618451+ThiaJay@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "integration: regenerate combined Core lockfile"
          git push origin HEAD:integration/universal-player-web

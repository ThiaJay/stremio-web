name: Stremio Enhanced source integration acceptance

on:
  push:
    branches:
      - feature/enhanced-subtitles-20261012-v6
  pull_request:
    branches:
      - feature/night-audio-video-integration-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed Enhanced source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check bundled Core and customised Video provenance
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const p=require('./package.json');
          const provenance=require('./vendor/core-web/provenance.json');
          if(p.dependencies['@stremio/stremio-core-web']!=='file:vendor/core-web/stremio-stremio-core-web-0.65.0.tgz') throw Error('Core package dependency changed');
          if(p.dependencies['@stremio/stremio-video']!=='github:ThiaJay/stremio-video#a5ef2c6729d74a39f0096422365633d18cf5a687') throw Error('Video candidate changed');
          if(provenance.coreSourceSha!=='303d7c0bb8bd6d55f11f2f751e55e66040da4f8c') throw Error('Core source not reviewed');
          const actual=crypto.createHash('sha256').update(fs.readFileSync('vendor/core-web/'+provenance.tarballName)).digest('hex');
          if(actual!==provenance.sha256 || actual!=='305cb2fb6c78ff6c719aa4713ddfd719787f38ef1069bb198592e6bda6d78c60') throw Error('Core bundle hash mismatch');
          for(const [path,marker] of [
            ['src/routes/Player/Player.js','enhancedSkipModes.resolveMode'],
            ['src/routes/Player/useSubtitles.ts','enhancedSubtitlePolicy.decide'],
            ['src/routes/Player/useAudio.ts','enhancedSubtitlePolicy.preferredAudioTrack'],
            ['src/routes/Settings/Player/Player.tsx','<EnhancedSubtitlePreferences />']
          ]) if(!fs.readFileSync(path,'utf8').includes(marker)) throw Error('Missing integrated source: '+path);
          console.log('Web source identity, Core bundle, Video dependency and feature adapters verified');
          JS
      - name: Install dependencies without install-time scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile exact Foundation subtitle provenance contract
        run: |
          node --test tests/subtitleProvenanceTypes.node.mjs
          pnpm exec tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node tests/subtitle-provenance-types/globals.d.mts tests/subtitle-provenance-types/preference-provenance.type-test.mts
      - name: Run Enhanced smart subtitle and skip policy regressions
        run: node --test tests/enhancedSubtitlesPolicy.node.mjs tests/enhancedSkipModes.node.mjs
      - name: Run existing Web regression suite
        run: pnpm exec jest --runInBand
      - name: Lint without reducing the previous threshold
        run: pnpm exec eslint src --max-warnings 287
      - name: Compile complete Stremio Web preview in isolation
        run: pnpm exec webpack --mode production
      - name: Run isolated anonymous Chromium shell acceptance
        run: node tests/enhancedBrowserSmoke.node.mjs
      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level moderate

# Source-only acceptance. Deliberately no Pages, upload, release, signing,
# account sign-in, hosted Worker write or TV installation.

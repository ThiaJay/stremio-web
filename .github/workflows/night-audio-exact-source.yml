name: Night Audio exact source acceptance
on:
  push:
    branches:
      - feature/night-audio-video-integration-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-audio-exact-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate committed source and lockfile pin
        shell: bash
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pin = 'a5ef2c6729d74a39f0096422365633d18cf5a687';
          const pkg = require('./package.json');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          assert.equal(pkg.dependencies['@stremio/stremio-video'], 'github:ThiaJay/stremio-video#' + pin);
          assert.ok(lock.includes('codeload.github.com/ThiaJay/stremio-video/tar.gz/' + pin));
          assert.ok(!workspace.includes("'@stremio/stremio-video@0.0.98':"));
          console.log('Reviewed source commit and lockfile match');
          JS
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify delivered player still exposes guarded DSP
        shell: bash
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const root = 'node_modules/@stremio/stremio-video/src/';
          const policy = require('./' + root + 'audio/nightAudioPolicy');
          const adapter = require('./' + root + 'audio/MpvNightAudioSession');
          assert.equal(typeof adapter.NightAudioSession, 'function');
          assert.equal(adapter.classifyAudio({format:'float'}, {format:'float'}), 'pcm');
          assert.equal(adapter.classifyAudio({format:'float'}, {format:'spdif-ac3'}), 'bitstream');
          assert.ok(policy.buildMpvFilter('balanced').includes('acompressor'));
          assert.equal(policy.buildMpvFilter('injected:cmd'), null);
          const shell = fs.readFileSync(root + 'ShellVideo/ShellVideo.js', 'utf8');
          for (const key of ["'setNightAudio'", "if (propName === 'stream') return stream;", 'stream = null;', 'props.seeking === true']) {
            assert.ok(shell.includes(key));
          }
          JS
      - name: All player tests
        run: pnpm exec jest --runInBand
      - name: Lint under original warnings limit
        run: pnpm exec eslint src --max-warnings 287
      - name: Production build
        run: pnpm exec webpack --mode production
      - name: Production advisory gate
        run: pnpm audit --prod --audit-level moderate
# No preview upload, deployment, write permissions or release.

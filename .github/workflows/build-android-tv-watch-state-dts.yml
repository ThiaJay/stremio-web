name: Build Android TV watched state and DTS test APKs

on:
  push:
    branches: [fix/android-tv-watch-state-dts-20260923]
    paths:
      - .github/workflows/build-android-tv-watch-state-dts.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_KOTLIN_COMMIT: 2a8083f1026603e7c49f104473340d110902a72c
  FIXED_CORE_COMMIT: fd2a999b8ec94f72d4ae2dcd0641da94817e5edb
  NDK_VERSION: 29.0.14206865
  RUST_VERSION: '1.77'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            gradle_target: arm64
            source_url: https://dl.strem.io/android/v1.10.4-androidTV/com.stremio.one-1.10.4-33145732-arm64-v8a.apk
            source_sha: caaf4faba423a47c3174eda08b94057956ce32af616c6377b3485f4f5dec993c
            output_name: Stremio-Watch-Fix-1.10.4-arm64.apk
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            gradle_target: arm
            source_url: https://dl.strem.io/android/v1.10.4-androidTV/com.stremio.one-1.10.4-31048580-armeabi-v7a.apk
            source_sha: e18a5405bb53e12a903ff477457318b8f8d3c8e1995e0a4c3ff5d8893d1ccf0b
            output_name: Stremio-Watch-Fix-1.10.4-arm.apk

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Install pinned Android and Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          "${SDKMANAGER}" "ndk;${NDK_VERSION}" >/dev/null
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup target add --toolchain "${RUST_VERSION}" "${{ matrix.rust_target }}"
          rustup default "${RUST_VERSION}"

      - name: Download immutable official APK and Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o /tmp/stremio.apk "${{ matrix.source_url }}"
          echo "${{ matrix.source_sha }}  /tmp/stremio.apk" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
          unzip -q /tmp/stremio.apk "lib/${{ matrix.abi }}/libstremio_core_kotlin.so" -d /tmp/original

      - name: Build minimal fixed Android Core bridge
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Stremio/stremio-core-kotlin.git /tmp/core-kotlin
          git -C /tmp/core-kotlin checkout "${CORE_KOTLIN_COMMIT}"
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/core-kotlin/Cargo.toml')
          text=root.read_text()
          old='git = "https://github.com/Stremio/stremio-core", branch = "development"'
          new='git = "https://github.com/ThiaJay/stremio-core", rev = "fd2a999b8ec94f72d4ae2dcd0641da94817e5edb"'
          if old not in text:
              raise SystemExit('Core dependency anchor missing')
          root.write_text(text.replace(old,new,1))
          gradle=Path('/tmp/core-kotlin/stremio-core-kotlin/build.gradle.kts')
          text=gradle.read_text()
          old='targets = listOf("arm", "arm64", "x86", "x86_64")'
          new='targets = listOf("${{ matrix.gradle_target }}")'
          if old not in text:
              raise SystemExit('Android target anchor missing')
          gradle.write_text(text.replace(old,new,1))
          PY
          cd /tmp/core-kotlin
          cargo update -p stremio-core
          cd stremio-core-kotlin
          ./gradlew cargoBuild --no-daemon
          fixed="$(find ../target -path '*/${{ matrix.rust_target }}/*' -name libstremio_core_kotlin.so -type f | head -1)"
          test -n "$fixed"
          cp "$fixed" /tmp/fixed.so
          file /tmp/fixed.so

      - name: Prove native Core interface compatibility
        shell: bash
        run: |
          set -euo pipefail
          original="/tmp/original/lib/${{ matrix.abi }}/libstremio_core_kotlin.so"
          test -s "$original"
          test -s /tmp/fixed.so

          nm -D --defined-only "$original" | awk '{print $3}' | sed '/^$/d' | sort -u | grep '^Java_com_stremio_core_' > /tmp/original.jni
          nm -D --defined-only /tmp/fixed.so | awk '{print $3}' | sed '/^$/d' | sort -u | grep '^Java_com_stremio_core_' > /tmp/fixed.jni
          diff -u /tmp/original.jni /tmp/fixed.jni

          readelf -h "$original" | grep -E 'Class:|Machine:'
          readelf -h /tmp/fixed.so | grep -E 'Class:|Machine:'

          required=(
            Java_com_stremio_core_Core_decodeStreamDataNative
            Java_com_stremio_core_Core_dispatchNative
            Java_com_stremio_core_Core_getStateNative
            Java_com_stremio_core_Core_initializeNative
            Java_com_stremio_core_Core_sendNextAnalyticsBatch
          )
          for symbol in "${required[@]}"; do
            grep -Fx "$symbol" /tmp/fixed.jni
          done

      - name: Decode APK and apply bounded patches
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f -o /tmp/decoded /tmp/stremio.apk
          python - <<'PY'
          from pathlib import Path

          root=Path('/tmp/decoded')
          manifest=root/'AndroidManifest.xml'
          text=manifest.read_text()
          replacements={
            'package="com.stremio.one"':'package="com.stremio.watchfix"',
            'com.stremio.one.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION':'com.stremio.watchfix.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION',
            'android:label="@string/app_name"':'android:label="Stremio Watch Fix"',
            'android:authorities="com.stremio.one.content"':'android:authorities="com.stremio.watchfix.content"',
            'android:authorities="com.stremio.one.firebaseinitprovider"':'android:authorities="com.stremio.watchfix.firebaseinitprovider"',
            'android:authorities="com.stremio.one.androidx-startup"':'android:authorities="com.stremio.watchfix.androidx-startup"',
          }
          for old,new in replacements.items():
            if old not in text:
              raise SystemExit(f'Manifest anchor missing: {old}')
            text=text.replace(old,new)
          manifest.write_text(text)

          matches=list(root.glob('smali*/io/github/anilbeesetti/nextlib/media3ext/ffdecoder/NextRenderersFactory.smali'))
          if len(matches)!=1:
            raise SystemExit(f'Expected one NextRenderersFactory, found {len(matches)}')
          smali=matches[0]
          code=smali.read_text()
          start=code.index('.method protected buildAudioRenderers')
          end=code.index('.end method',start)+len('.end method')
          method=code[start:end]
          old='    if-ne p2, p3, :cond_1'
          new='    if-ne p2, p2, :cond_1'
          if method.count(old)!=1:
            raise SystemExit('Audio renderer preference anchor changed')
          method=method.replace(old,new)
          code=code[:start]+method+code[end:]
          video_start=code.index('.method protected buildVideoRenderers')
          video_end=code.index('.end method',video_start)
          if old not in code[video_start:video_end]:
            raise SystemExit('Video renderer ordering baseline changed')
          smali.write_text(code)
          PY

          target="/tmp/decoded/lib/${{ matrix.abi }}/libstremio_core_kotlin.so"
          test -s "$target"
          cp /tmp/fixed.so "$target"
          cmp -s /tmp/fixed.so "$target"

      - name: Rebuild, sign and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/candidate-unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          keytool -genkeypair -noprompt \
            -keystore /tmp/watchfix.jks \
            -storepass changeit \
            -keypass changeit \
            -alias watchfix \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=Stremio Watch Fix Test,O=Local Side By Side Build,C=GB"
          "$build_tools/zipalign" -f -p 4 /tmp/candidate-unsigned.apk /tmp/candidate-aligned.apk
          "$build_tools/apksigner" sign \
            --ks /tmp/watchfix.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "/tmp/${{ matrix.output_name }}" \
            /tmp/candidate-aligned.apk
          "$build_tools/apksigner" verify --verbose --print-certs "/tmp/${{ matrix.output_name }}"
          "$build_tools/aapt" dump badging "/tmp/${{ matrix.output_name }}" | grep -F "package: name='com.stremio.watchfix'"

      - name: Verify packaged fixed Core and create evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verify
          mkdir -p /tmp/verify
          unzip -q "/tmp/${{ matrix.output_name }}" "lib/${{ matrix.abi }}/libstremio_core_kotlin.so" -d /tmp/verify
          cmp -s /tmp/fixed.so "/tmp/verify/lib/${{ matrix.abi }}/libstremio_core_kotlin.so"

          mkdir -p dist
          cp "/tmp/${{ matrix.output_name }}" dist/
          {
            echo "Stremio Android TV 1.10.4 side by side watched state and DTS test build"
            echo "ABI: ${{ matrix.abi }}"
            echo "Package: com.stremio.watchfix"
            echo "Official package com.stremio.one is not replaced"
            echo "Official APK SHA256: ${{ matrix.source_sha }}"
            echo "Core Kotlin bridge commit: ${CORE_KOTLIN_COMMIT}"
            echo "Minimal fixed Core commit: ${FIXED_CORE_COMMIT}"
            echo "Watched state fix: genuine Ended after a seek beyond the existing credits threshold establishes watched state before resume cleanup"
            echo "Seek alone remains non authoritative"
            echo "DTS patch: FFmpeg audio renderer preference only, with video renderer ordering unchanged"
            echo
            echo "JNI exports"
            cat /tmp/fixed.jni
            echo
            echo "Checksums"
            sha256sum "/tmp/${{ matrix.output_name }}" /tmp/fixed.so
          } > "dist/${{ matrix.abi }}-EVIDENCE.txt"
          sha256sum dist/* > "dist/${{ matrix.abi }}-SHA256SUMS.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: stremio-watch-fix-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

name: Android mobile skip runtime acceptance

on:
  push:
    branches:
      - acceptance/android-mobile-skip-runtime-20260923
    paths:
      - "acceptance/android-mobile-skip/**"
      - ".github/workflows/android-mobile-skip-acceptance.yml"
  pull_request:
    branches:
      - development
    paths:
      - "acceptance/android-mobile-skip/**"
      - ".github/workflows/android-mobile-skip-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mobile-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CORE_SOURCE_SHA: e12b41173b0aca767794fb6854f535817ad07654
      WEB_SOURCE_SHA: 26f2a5987618c62199593dec9a7ca18f0b2ac9f2
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify accepted Web base is preserved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$WEB_SOURCE_SHA"

      - name: Checkout exact accepted Core source
        uses: actions/checkout@v4
        with:
          repository: ThiaJay/stremio-core
          ref: ${{ env.CORE_SOURCE_SHA }}
          path: exact-core

      - name: Verify exact Core source and contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C exact-core rev-parse HEAD)" = "$CORE_SOURCE_SHA"
          grep -F "A resolved skip segment always means a seek within the currently selected media." exact-core/SKIP_SEGMENTS.md
          grep -F "Next-video UI keeps priority near episode end." exact-core/SKIP_SEGMENTS.md
          grep -F "Android mobile;" exact-core/SKIP_SEGMENTS.md
          grep -F "no unintended watched-state or next-episode transition." exact-core/SKIP_SEGMENTS.md

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile native Android acceptance app and tests
        shell: bash
        run: gradle --no-daemon -p acceptance/android-mobile-skip :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run genuine Android mobile runtime acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon -p acceptance/android-mobile-skip :app:connectedDebugAndroidTest

      - name: Write source bound receipt
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "validation_head": os.environ.get("GITHUB_SHA"),
              "web_source_sha": os.environ["WEB_SOURCE_SHA"],
              "core_source_sha": os.environ["CORE_SOURCE_SHA"],
              "runtime": "Android emulator API 34 x86_64 Pixel 6 profile",
              "scope": "native Android mobile skip presentation runtime",
              "expected_instrumentation_cases": 6,
              "official_android_app_adoption_claimed": False,
              "android_tv_acceptance_claimed": False,
              "physical_av_acceptance_claimed": False,
          }
          Path("acceptance/android-mobile-skip/acceptance-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-skip-runtime-evidence
          if-no-files-found: error
          path: |
            acceptance/android-mobile-skip/acceptance-receipt.json
            acceptance/android-mobile-skip/app/build/reports/androidTests/connected/**
            acceptance/android-mobile-skip/app/build/outputs/androidTest-results/connected/**
